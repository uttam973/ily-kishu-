<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I'm So Sorry, kishu❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffe6e9 0%, #f0d3f7 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(220, 120, 150, 0.2);
            border: 2px solid #fff;
            position: relative;
        }

        .bear-avatar {
            font-size: 80px;
            animation: bounce 2s infinite ease-in-out;
            margin-bottom: 10px;
            display: inline-block;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        h1 {
            color: #d63384;
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            position: relative;
            min-height: 60px;
        }

        button {
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .yes-btn {
            background-color: #ff4b72;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 75, 114, 0.4);
        }

        .yes-btn:hover {
            transform: scale(1.08);
            background-color: #e03a5f;
        }

        .no-btn {
            background-color: #e0e0e0;
            color: #666;
            position: relative;
        }

        .response-style {
            padding: 15px;
            background-color: #fff0f3;
            border-radius: 16px;
            border: 1px dashed #ff4b72;
            color: #d63384;
            font-weight: 600;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .heart {
            position: absolute;
            color: rgba(255, 105, 180, 0.3);
            font-size: 20px;
            animation: float 6s infinite linear;
            z-index: -1;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="heart" style="left: 10%; animation-delay: 0s;">❤️</div>
    <div class="heart" style="left: 25%; animation-delay: 2s;">💖</div>
    <div class="heart" style="left: 60%; animation-delay: 1s;">🌸</div>
    <div class="heart" style="left: 80%; animation-delay: 4s;">💕</div>

    <div class="card">
        <div class="bear-avatar" id="avatar">🥺</div>
        <h1>I'm So Sorry, kishu you mean a lot to me !</h1>
        
        <p id="mainText">I really messed up, and I feel terrible for making you feel this way. You mean the absolute world to me, and making you smile is my favorite thing to do. Can you forgive me?</p>
        
        <div class="btn-group" id="btnGroup">
            <button class="yes-btn" onclick="forgiveMe()">I Forgive You 💕</button>
            <button class="no-btn" id="noBtn" onmouseover="dodgeBtn()" onclick="dodgeBtn()">Still Mad 😤</button>
        </div>
    </div>

    <script>
        function forgiveMe() {
            document.getElementById('avatar').innerText = '🥰';
            
            // Replace text in place
            const textElement = document.getElementById('mainText');
            textElement.innerText = "YAY! 🎉 Thank you my love! I promise to make it up to you with lots of hugs, kisses, and your favorite snacks! I love you so much! ❤️";
            textElement.classList.add('response-style');
            
            // Hide the buttons after forgiveness
            document.getElementById('btnGroup').style.display = 'none';
            
            for (let i = 0; i < 15; i++) {
                createPopHeart();
            }
        }

        function dodgeBtn() {
            const btn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - btn.offsetWidth - 40) - (window.innerWidth / 2 - btn.offsetWidth);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight - 40) - (window.innerHeight / 2 - btn.offsetHeight);
            
            btn.style.position = 'absolute';
            btn.style.left = `${Math.max(10, Math.min(x, 200))}px`;
            btn.style.top = `${Math.max(-100, Math.min(y, 100))}px`;
        }

        function createPopHeart() {
            const heart = document.createElement('div');
            heart.innerHTML = '💖';
            heart.style.position = 'fixed';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = Math.random() * 100 + 'vh';
            heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
            heart.style.transition = 'all 1s ease-out';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.style.transform = 'scale(1.5)';
                heart.style.opacity = '0';
            }, 50);

            setTimeout(() => {
                heart.remove();
            }, 1000);
        }
    </script>
</body>
</html>
